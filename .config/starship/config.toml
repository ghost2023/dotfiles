"$schema" = 'https://starship.rs/config-schema.json'


right_format="$status $cmd_duration $time"

# [git_branch]
# style = "green"
# symbol = ""
# format = '[<$branch(:$remote_branch)>]($style) '

[aws]
disabled = true

[gcloud]
disabled = true

[time]
disabled = false
format = "[$time]($style) "
style = "#727272"

# left 

[status]
disabled = false

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$line_break\
$character"""

[directory]
style = "blue"
truncate_to_repo = false

[directory.substitutions]
"~" = "~"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](purple)"

[git_branch]
format = '[<$branch(:$remote_branch)>]($style)'
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = ""
ahead =""
behind = ""
diverged=""


[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
disabled = true

[nodejs]
disabled = true

[kotlin]
disabled = true


